version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fidelity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fidelity_db
    ports:
      - '5432:5432'
    volumes:
      - fidelity_pgdata:/var/lib/postgresql/data
      - ./src/database/migrations/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  fidelity_pgdata:
